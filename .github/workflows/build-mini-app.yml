name: Build Layla Talking Story Mini-App
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo '::warning::package-lock.json is not yet committed; temporary npm install fallback'
            npm install --no-audit --no-fund
          fi
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify package
        run: npm run verify
      - name: Upload importable files
        uses: actions/upload-artifact@v4
        with:
          name: layla-talking-story-mini-app
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Export complete review source as UTF-8 TXT
        run: python scripts/export-review.py
      - name: Upload review text
        uses: actions/upload-artifact@v4
        with:
          name: layla-talking-story-source-review-txt
          path: review/layla-talking-story-source-review.txt
          if-no-files-found: error
          retention-days: 14

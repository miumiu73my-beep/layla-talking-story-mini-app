name: Generate npm lockfile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/generate-lockfile.yml']
permissions:
  contents: read
concurrency:
  group: generate-npm-lockfile
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Resolve and verify lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm test
          npm run build
          npm run verify
      - name: Commit only the verified lockfile
        run: |
          git add -- package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add verified npm lockfile'
          git push origin HEAD:main
